<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>错题本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(135deg,#2c1b54,#422880,#201440);padding:16px 12px 80px;color:#fff}
.container{max-width:600px;margin:0 auto}
.header{text-align:center;padding:16px 0 20px}
.header h1{font-size:26px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#ff6b6b,#ffd700);-webkit-background-clip:text;background-clip:text;color:transparent}
.header p{color:#a8a8d8;font-size:13px;margin-top:4px}

/* 筛选栏 */
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;font-size:13px;cursor:pointer;white-space:nowrap}
.filter-chip.active{background:linear-gradient(90deg,#ff6b6b,#ee4c4c);color:#fff;border-color:transparent;font-weight:bold}

/* 条目卡片 */
.entry-card{background:rgba(255,255,255,0.06);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:4px solid #ff6b6b}
.entry-card .ec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.entry-card .ec-subject{font-size:12px;padding:2px 10px;border-radius:10px;background:rgba(255,215,0,0.15);color:#ffd700;font-weight:bold}
.entry-card .ec-date{font-size:11px;color:#888}
.entry-card .ec-q{font-size:15px;line-height:1.6;margin-bottom:8px;color:#fff}
.entry-card .ec-row{font-size:13px;line-height:1.6;margin-top:4px}
.entry-card .ec-row .label{color:#ff8888;font-weight:bold}
.entry-card .ec-row.correct .label{color:#2ecc71}
.entry-card .ec-row .val{color:#ccc}
.entry-card .ec-note{font-size:12px;color:#a8a8d8;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.1)}
.entry-card .ec-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.entry-card .ec-actions button{padding:5px 12px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.ec-edit{background:rgba(78,205,196,0.2);color:#4ecdc4}
.ec-del{background:rgba(255,107,107,0.2);color:#ff8888}

/* 悬浮添加按钮 */
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#ee4c4c);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(238,76,76,0.5);z-index:50;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(0.9)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:linear-gradient(180deg,#2c1b54,#1a1a2e);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
.sheet h3{color:#ffd700;margin-bottom:14px;font-size:18px;text-align:center}
.sheet label{display:block;font-size:13px;color:#a8a8d8;margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(0,0,0,0.3);color:#fff;font-size:14px;font-family:inherit}
.sheet textarea{min-height:70px;resize:vertical}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{outline:none;border-color:#ffd700}
.sheet-btns{display:flex;gap:10px;margin-top:16px}
.sheet-btns button{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-save{background:linear-gradient(90deg,#ffd700,#ff9500);color:#222}
.btn-cancel{background:rgba(255,255,255,0.1);color:#ccc}

.empty{text-align:center;padding:60px 20px;color:#666}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📕 错题本</h1>
    <p>记录每一道错题，不再犯第二次</p>
  </div>

  <div class="filter-bar" id="filterBar">
    <div class="filter-chip active" data-subject="全部" onclick="setFilter('全部',this)">全部</div>
  </div>

  <div id="entryList"></div>
</div>

<button class="fab" onclick="openAdd()">+</button>

<!-- 添加/编辑弹窗 -->
<div class="mask" id="editMask">
  <div class="sheet">
    <h3 id="sheetTitle">➕ 添加错题</h3>
    <label>科目</label>
    <input type="text" id="fSubject" list="subjectList" placeholder="如：数学、英语、物理">
    <datalist id="subjectList"></datalist>
    <label>题目</label>
    <textarea id="fQuestion" placeholder="写下题目或粘贴照片描述…"></textarea>
    <label>我的错误答案</label>
    <textarea id="fWrong" placeholder="当时写的答案"></textarea>
    <label>正确答案</label>
    <textarea id="fCorrect" placeholder="正确答案"></textarea>
    <label>备注 / 错因分析</label>
    <textarea id="fNote" placeholder="为什么错？知识点？（可选）"></textarea>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-save" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<script>
const KEY = "wrongBookEntries";
let currentFilter = "全部";
let editingIdx = -1;

function getEntries(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch{ return []; } }
function setEntries(l){ localStorage.setItem(KEY, JSON.stringify(l)); }

function renderFilters(){
  const entries = getEntries();
  const subjects = [...new Set(entries.map(e=>e.subject).filter(Boolean))];
  const bar = document.getElementById("filterBar");
  bar.innerHTML = '<div class="filter-chip'+(currentFilter==="全部"?" active":"")+'" data-subject="全部" onclick="setFilter(\'全部\',this)">全部</div>' +
    subjects.map(s=>`<div class="filter-chip${currentFilter===s?' active':''}" data-subject="${s}" onclick="setFilter('${s}',this)">${s}</div>`).join("");
  // 更新 datalist
  document.getElementById("subjectList").innerHTML = subjects.map(s=>`<option value="${s}">`).join("");
}

function setFilter(s, el){
  currentFilter = s;
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  renderList();
}

function renderList(){
  const entries = getEntries();
  const list = currentFilter==="全部" ? entries : entries.filter(e=>e.subject===currentFilter);
  const el = document.getElementById("entryList");
  if(!list.length){
    el.innerHTML = '<div class="empty"><div class="icon">📝</div><p>还没有错题记录<br>点右下角 + 添加第一道</p></div>';
    return;
  }
  el.innerHTML = list.slice().reverse().map(e=>{
    const idx = entries.indexOf(e);
    return `<div class="entry-card">
      <div class="ec-head">
        <span class="ec-subject">${e.subject||"未分类"}</span>
        <span class="ec-date">${e.date||""}</span>
      </div>
      <div class="ec-q">${escapeHtml(e.question||"")}</div>
      <div class="ec-row"><span class="label">✗ 错：</span><span class="val">${escapeHtml(e.wrong||"")}</span></div>
      <div class="ec-row correct"><span class="label">✓ 对：</span><span class="val">${escapeHtml(e.correct||"")}</span></div>
      ${e.note?`<div class="ec-note">💡 ${escapeHtml(e.note)}</div>`:""}
      <div class="ec-actions">
        <button class="ec-edit" onclick="openEdit(${idx})">✏️ 编辑</button>
        <button class="ec-del" onclick="delEntry(${idx})">🗑 删除</button>
      </div>
    </div>`;
  }).join("");
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function openAdd(){
  editingIdx = -1;
  document.getElementById("sheetTitle").innerText = "➕ 添加错题";
  document.getElementById("fSubject").value = "";
  document.getElementById("fQuestion").value = "";
  document.getElementById("fWrong").value = "";
  document.getElementById("fCorrect").value = "";
  document.getElementById("fNote").value = "";
  document.getElementById("editMask").classList.add("show");
}
function openEdit(idx){
  editingIdx = idx;
  const e = getEntries()[idx];
  document.getElementById("sheetTitle").innerText = "✏️ 编辑错题";
  document.getElementById("fSubject").value = e.subject||"";
  document.getElementById("fQuestion").value = e.question||"";
  document.getElementById("fWrong").value = e.wrong||"";
  document.getElementById("fCorrect").value = e.correct||"";
  document.getElementById("fNote").value = e.note||"";
  document.getElementById("editMask").classList.add("show");
}
function closeEdit(){ document.getElementById("editMask").classList.remove("show"); }

function saveEntry(){
  const subject = document.getElementById("fSubject").value.trim();
  const question = document.getElementById("fQuestion").value.trim();
  if(!question){ alert("请填写题目"); return; }
  const entry = {
    subject, question,
    wrong: document.getElementById("fWrong").value.trim(),
    correct: document.getElementById("fCorrect").value.trim(),
    note: document.getElementById("fNote").value.trim(),
    date: new Date().toLocaleDateString("zh-CN")
  };
  const entries = getEntries();
  if(editingIdx>=0){ entries[editingIdx] = entry; }
  else { entries.push(entry); }
  setEntries(entries);
  closeEdit();
  renderFilters();
  renderList();
}

function delEntry(idx){
  if(!confirm("删除这道错题？")) return;
  const entries = getEntries();
  entries.splice(idx,1);
  setEntries(entries);
  renderFilters();
  renderList();
}

renderFilters();
renderList();
</script>
</body>
</html>
