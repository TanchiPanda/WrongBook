<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>错题本</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(135deg,#2c1b54,#422880,#201440);padding:16px 12px 80px;color:#fff}
.container{max-width:600px;margin:0 auto}
.header{text-align:center;padding:16px 0 16px}
.header h1{font-size:26px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#ff6b6b,#ffd700);-webkit-background-clip:text;background-clip:text;color:transparent}
.header p{color:#a8a8d8;font-size:13px;margin-top:4px}

.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:14px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;font-size:13px;cursor:pointer;white-space:nowrap}
.filter-chip.active{background:linear-gradient(90deg,#ff6b6b,#ee4c4c);color:#fff;border-color:transparent;font-weight:bold}

.entry-card{background:rgba(255,255,255,0.06);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:4px solid #ff6b6b;cursor:pointer}
.entry-card.archived{opacity:0.5;border-left-color:#888}
.entry-card .ec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.entry-card .ec-subject{font-size:12px;padding:2px 10px;border-radius:10px;background:rgba(255,215,0,0.15);color:#ffd700;font-weight:bold}
.entry-card .ec-date{font-size:11px;color:#888}
.entry-card .ec-q{font-size:14px;line-height:1.5;color:#ddd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-card .ec-meta{font-size:11px;color:#888;margin-top:6px}

.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#ee4c4c);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(238,76,76,0.5);z-index:50;display:flex;align-items:center;justify-content:center}

.mask{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:linear-gradient(180deg,#2c1b54,#1a1a2e);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow-y:auto}
.sheet h3{color:#ffd700;margin-bottom:14px;font-size:18px;text-align:center}
.sheet label{display:block;font-size:13px;color:#a8a8d8;margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(0,0,0,0.3);color:#fff;font-size:14px;font-family:inherit}
.sheet textarea{min-height:80px;resize:vertical;font-family:"SF Mono",Monaco,monospace;font-size:13px}
.sheet input:focus,.sheet textarea:focus{outline:none;border-color:#ffd700}
.sheet-btns{display:flex;gap:10px;margin-top:16px}
.sheet-btns button{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-save{background:linear-gradient(90deg,#ffd700,#ff9500);color:#222}
.btn-cancel{background:rgba(255,255,255,0.1);color:#ccc}

.detail-page{display:none}
.detail-page.show{display:block}
.detail-back{display:inline-block;color:#4ecdc4;cursor:pointer;font-size:14px;margin-bottom:12px}
.detail-subject{display:inline-block;padding:3px 12px;border-radius:10px;background:rgba(255,215,0,0.15);color:#ffd700;font-size:12px;font-weight:bold;margin-bottom:10px}
.detail-date{font-size:11px;color:#888;float:right;margin-top:6px}
.detail-section{background:rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-top:12px}
.detail-section h4{font-size:13px;color:#a8a8d8;margin-bottom:8px;letter-spacing:1px}
.detail-section.wrong{border-left:3px solid #ff6b6b}
.detail-section.correct{border-left:3px solid #2ecc71}
.detail-section.note{border-left:3px solid #4ecdc4}
.content{font-size:14px;line-height:1.7;color:#fff;word-break:break-word}
.content p{margin:6px 0}
.content code{background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;font-size:13px}
.content pre{background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0}

.comment{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
.comment:last-child{border-bottom:none}
.comment-head{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.comment-result{font-weight:bold}
.comment-result.ok{color:#2ecc71}
.comment-result.fail{color:#ff6b6b}
.comment-text{font-size:13px;color:#ccc;line-height:1.5}

.comment-add{margin-top:12px;display:flex;gap:8px}
.comment-add input{flex:1;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(0,0,0,0.3);color:#fff;font-size:13px}
.comment-add button{padding:10px 14px;border:none;border-radius:8px;background:linear-gradient(90deg,#ffd700,#ff9500);color:#222;font-weight:bold;cursor:pointer}
.result-btns{display:flex;gap:8px;margin-top:8px}
.result-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer}
.btn-ok{background:rgba(46,204,113,0.3);color:#2ecc71}
.btn-fail{background:rgba(255,107,107,0.3);color:#ff6b6b}

.action-row{display:flex;gap:8px;margin-top:16px}
.action-row button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
.btn-archive{background:rgba(255,215,0,0.2);color:#ffd700}
.btn-del{background:rgba(255,107,107,0.2);color:#ff6b6b}
.btn-edit{background:rgba(78,205,196,0.2);color:#4ecdc4}

.empty{text-align:center;padding:60px 20px;color:#666}
.empty .icon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>

<div class="container" id="listPage">
  <div class="header">
    <h1>📕 错题本</h1>
    <p>Markdown · LaTeX · 重练追踪</p>
  </div>
  <div class="filter-bar" id="filterBar"></div>
  <div id="entryList"></div>
</div>

<div class="container detail-page" id="detailPage"></div>

<button class="fab" onclick="openAdd()">+</button>

<div class="mask" id="editMask">
  <div class="sheet">
    <h3 id="sheetTitle">➕ 添加错题</h3>
    <label>科目</label>
    <input type="text" id="fSubject" list="subjectList" placeholder="数学/英语/物理…">
    <datalist id="subjectList"></datalist>
    <label>题目（支持 Markdown，公式用 $...$ 或 $$...$$）</label>
    <textarea id="fQuestion" rows="4" placeholder="例如：求解方程 $x^2 + 5x + 6 = 0$"></textarea>
    <label>我的错误答案</label>
    <textarea id="fWrong" rows="2" placeholder="错误答案（支持 Markdown）"></textarea>
    <label>正确答案</label>
    <textarea id="fCorrect" rows="2" placeholder="正确答案（支持 Markdown）"></textarea>
    <label>错因分析</label>
    <textarea id="fNote" rows="2" placeholder="可选"></textarea>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-save" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<script>
const KEY = "wrongBookEntries";
let currentFilter = "全部";
let editingIdx = -1;
let currentDetailIdx = -1;

function getEntries(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch{ return []; } }
function setEntries(l){ localStorage.setItem(KEY, JSON.stringify(l)); }

function renderMarkdown(text){
  if(!text) return "";
  let html = marked.parse(text);
  html = html.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr) => {
    try { return katex.renderToString(expr.trim(), {displayMode:true}); }
    catch { return m; }
  });
  html = html.replace(/\$([^$\n]+?)\$/g, (m, expr) => {
    try { return katex.renderToString(expr.trim(), {displayMode:false}); }
    catch { return m; }
  });
  return html;
}

function renderFilters(){
  const entries = getEntries();
  const subjects = [...new Set(entries.filter(e=>!e.archived).map(e=>e.subject).filter(Boolean))];
  const bar = document.getElementById("filterBar");
  bar.innerHTML = `<div class="filter-chip${currentFilter==="全部"?" active":''}" onclick="setFilter('全部',this)">全部</div>` +
    subjects.map(s=>`<div class="filter-chip${currentFilter===s?' active':''}" onclick="setFilter('${s}',this)">${s}</div>`).join("") +
    `<div class="filter-chip${currentFilter==="已归档"?" active":''}" onclick="setFilter('已归档',this)">📦 已归档</div>`;
  document.getElementById("subjectList").innerHTML = subjects.map(s=>`<option value="${s}">`).join("");
}
function setFilter(s, el){
  currentFilter = s;
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  renderList();
}

function renderList(){
  const entries = getEntries();
  let list;
  if(currentFilter==="已归档") list = entries.filter(e=>e.archived);
  else if(currentFilter==="全部") list = entries.filter(e=>!e.archived);
  else list = entries.filter(e=>!e.archived && e.subject===currentFilter);
  const el = document.getElementById("entryList");
  if(!list.length){
    el.innerHTML = '<div class="empty"><div class="icon">📝</div><p>还没有记录<br>点右下角 + 添加</p></div>';
    return;
  }
  el.innerHTML = list.slice().reverse().map(e=>{
    const idx = entries.indexOf(e);
    const retryCount = (e.comments||[]).length;
    const lastResult = (e.comments||[]).slice(-1)[0];
    let statusIcon = "";
    if(lastResult){ statusIcon = lastResult.ok ? "✅" : "❌"; }
    return `<div class="entry-card${e.archived?' archived':''}" onclick="openDetail(${idx})">
      <div class="ec-head">
        <span class="ec-subject">${e.subject||"未分类"}</span>
        <span class="ec-date">${e.date||""}</span>
      </div>
      <div class="ec-q">${renderMarkdown(e.question||"")}</div>
      <div class="ec-meta">${retryCount?`重练 ${retryCount} 次 ${statusIcon}`:"首次记录"}</div>
    </div>`;
  }).join("");
}

function openAdd(){
  editingIdx = -1;
  document.getElementById("sheetTitle").innerText = "➕ 添加错题";
  ["fSubject","fQuestion","fWrong","fCorrect","fNote"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("editMask").classList.add("show");
}
function openEdit(idx){
  editingIdx = idx;
  const e = getEntries()[idx];
  document.getElementById("sheetTitle").innerText = "✏️ 编辑错题";
  document.getElementById("fSubject").value = e.subject||"";
  document.getElementById("fQuestion").value = e.question||"";
  document.getElementById("fWrong").value = e.wrong||"";
  document.getElementById("fCorrect").value = e.correct||"";
  document.getElementById("fNote").value = e.note||"";
  document.getElementById("editMask").classList.add("show");
}
function closeEdit(){ document.getElementById("editMask").classList.remove("show"); }

function saveEntry(){
  const question = document.getElementById("fQuestion").value.trim();
  if(!question){ alert("请填写题目"); return; }
  const entry = {
    subject: document.getElementById("fSubject").value.trim(),
    question,
    wrong: document.getElementById("fWrong").value.trim(),
    correct: document.getElementById("fCorrect").value.trim(),
    note: document.getElementById("fNote").value.trim(),
    date: new Date().toLocaleDateString("zh-CN"),
    comments: editingIdx>=0 ? (getEntries()[editingIdx].comments||[]) : [],
    archived: editingIdx>=0 ? (getEntries()[editingIdx].archived||false) : false
  };
  const entries = getEntries();
  if(editingIdx>=0) entries[editingIdx] = entry;
  else entries.push(entry);
  setEntries(entries);
  closeEdit(); renderFilters(); renderList();
}

function openDetail(idx){
  currentDetailIdx = idx;
  renderDetail();
  document.getElementById("listPage").style.display = "none";
  document.getElementById("detailPage").classList.add("show");
}
function closeDetail(){
  currentDetailIdx = -1;
  document.getElementById("detailPage").classList.remove("show");
  document.getElementById("listPage").style.display = "";
}

function renderDetail(){
  const e = getEntries()[currentDetailIdx];
  const el = document.getElementById("detailPage");
  const comments = e.comments||[];
  el.innerHTML = `
    <span class="detail-back" onclick="closeDetail()">← 返回列表</span>
    <div>
      <span class="detail-subject">${e.subject||"未分类"}</span>
      <span class="detail-date">${e.date||""}</span>
    </div>
    <div class="detail-section">
      <h4>📝 题目</h4>
      <div class="content">${renderMarkdown(e.question)}</div>
    </div>
    <div class="detail-section wrong">
      <h4>✗ 我的错误答案</h4>
      <div class="content">${renderMarkdown(e.wrong)||'<span style="color:#666">（无）</span>'}</div>
    </div>
    <div class="detail-section correct">
      <h4>✓ 正确答案</h4>
      <div class="content">${renderMarkdown(e.correct)||'<span style="color:#666">（无）</span>'}</div>
    </div>
    ${e.note?`<div class="detail-section note"><h4>💡 错因分析</h4><div class="content">${renderMarkdown(e.note)}</div></div>`:""}
    <div class="detail-section">
      <h4>🔄 重练记录（${comments.length}）</h4>
      ${comments.length? comments.map(c=>`
        <div class="comment">
          <div class="comment-head">
            <span class="comment-result ${c.ok?'ok':'fail'}">${c.ok?'✅ 答对':'❌ 错'}</span>
            <span>${c.date}</span>
          </div>
          ${c.text?`<div class="comment-text">${escapeHtml(c.text)}</div>`:""}
        </div>`).join("") : '<div style="color:#666;font-size:13px">还没有重练记录</div>'}
      <div class="comment-add">
        <input type="text" id="commentText" placeholder="备注（可选）">
      </div>
      <div class="result-btns">
        <button class="btn-ok" onclick="addComment(true)">✅ 这次对了</button>
        <button class="btn-fail" onclick="addComment(false)">❌ 又错了</button>
      </div>
    </div>
    <div class="action-row">
      <button class="btn-del" onclick="delEntry(${currentDetailIdx})">🗑 删除</button>
      <button class="btn-archive" onclick="toggleArchive(${currentDetailIdx})">${e.archived?'📤 取消归档':'📦 归档错题'}</button>
      <button class="btn-edit" onclick="openEdit(${currentDetailIdx});closeDetail()">✏️ 编辑</button>
    </div>`;
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function addComment(ok){
  const text = document.getElementById("commentText").value.trim();
  const entries = getEntries();
  const e = entries[currentDetailIdx];
  if(!e.comments) e.comments = [];
  e.comments.push({ ok, text, date: new Date().toLocaleString("zh-CN") });
  setEntries(entries);
  renderDetail(); renderList();
}

function toggleArchive(idx){
  const entries = getEntries();
  entries[idx].archived = !entries[idx].archived;
  setEntries(entries);
  renderFilters(); renderList(); renderDetail();
}
function delEntry(idx){
  if(!confirm("删除这道错题？")) return;
  const entries = getEntries();
  entries.splice(idx,1);
  setEntries(entries);
  closeDetail(); renderFilters(); renderList();
}

renderFilters();
renderList();
</script>
</body>
</html>
