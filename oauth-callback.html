<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>登录中…</title>
<style>
body{background:linear-gradient(135deg,#2c1b54,#422880);color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:40px}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">正在登录…</p>
</div>
<script src="auth.js"></script>
<script>
handleOAuthCallback().then(r=>{
  if(r.ok){
    localStorage.setItem("wordGameOneDriveEnabled","1");
    location.href = "index.html";
  } else {
    document.getElementById("msg").innerText = r.message;
    setTimeout(()=>location.href="index.html", 3000);
  }
});
</script>
</body>
</html>
